name: Security and official-core validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  config-and-security:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install static checker
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Bash and ShellCheck
        run: |
          bash -n xray-reality.sh tests/linux-smoke.sh
          shellcheck xray-reality.sh tests/linux-smoke.sh
          git diff --check
      - name: Download verified official test core
        run: |
          curl -q --fail --location --proto '=https' --proto-redir '=https' --retry 3 \
            https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-linux-64.zip -o /tmp/xray-test.zip
          echo 'e4bd9119f50ae7c41658b1abd0679ae06f98bd864a2907ff33f2f2cf7081b214  /tmp/xray-test.zip' | sha256sum -c -
          mkdir /tmp/xray-test
          unzip -q /tmp/xray-test.zip -d /tmp/xray-test
          chmod +x /tmp/xray-test/xray
      - name: Security regressions and all eight protocol configs
        env:
          XRAY_TEST_BIN: /tmp/xray-test/xray
        run: python3 -m unittest discover -s tests -v
      - name: Actual Linux systemd install and rollback
        if: matrix.os == 'ubuntu-24.04'
        run: sudo bash tests/linux-smoke.sh
